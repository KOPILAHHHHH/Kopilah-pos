<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KOPI-lah Mini POS</title>
<style>
  :root{
    --bg:#f7f3ea;
    --card:#ffffff;
    --ink:#1f1f1f;
    --muted:#6e6a63;
    --accent:#5b3a29;
    --accent2:#d9a441;
    --line:#e7dfd3;
    --danger:#a23b3b;
    --ok:#2f7d4a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .brand h1{margin:0;font-size:28px;letter-spacing:.5px}
  .brand small{color:var(--muted)}
  .pill{background:var(--accent);color:#fff;padding:8px 12px;border-radius:999px;font-size:13px}
  .grid{display:grid;grid-template-columns:1.5fr .9fr;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 18px rgba(55,42,30,.06)}
  h2{font-size:18px;margin:0 0 12px}
  .products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .product{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;cursor:pointer;text-align:left}
  .product:hover{border-color:#cdbca6}
  .product .name{font-weight:700;font-size:16px}
  .product .price{color:var(--accent);margin-top:5px;font-weight:700}
  .order-empty{color:var(--muted);padding:18px 6px;text-align:center}
  .lineitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:10px 0}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}
  .total-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:22px;font-weight:800}
  .paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .paybtn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;font-weight:700}
  .paybtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .primary,.secondary,.danger{border:none;border-radius:12px;padding:13px 14px;font-weight:800;font-size:15px}
  .primary{background:var(--accent2);color:#1d160c}
  .secondary{background:#eee8df;color:#3d342d}
  .danger{background:#f7e6e6;color:var(--danger)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat .k{color:var(--muted);font-size:12px}
  .stat .v{font-weight:800;font-size:22px;margin-top:5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:700}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .toolbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-weight:700}
  .section{margin-top:14px}
  input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}
  .edit-grid{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin:7px 0}
  .tiny{font-size:12px;color:var(--muted)}
  @media(max-width:820px){
    .grid{grid-template-columns:1fr}
    .products{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stats{grid-template-columns:repeat(2,1fr)}
    header{align-items:flex-start}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>KOPI-lah Mini POS</h1>
      <small>RM0 • 本机储存 • 可导出 CSV</small>
    </div>
    <div class="pill" id="todayLabel"></div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>点单</h2>
      <div class="products" id="products"></div>
    </section>

    <aside class="card">
      <h2>当前订单</h2>
      <div id="order"></div>
      <div class="total-row"><span>Total</span><span id="total">RM0.00</span></div>
      <div class="paygrid">
        <button class="paybtn active" data-pay="Cash">Cash</button>
        <button class="paybtn" data-pay="DuitNow">DuitNow</button>
        <button class="paybtn" data-pay="TNG">TNG</button>
      </div>
      <div class="actions">
        <button class="primary" id="completeBtn">Complete Order</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>
      <div class="tiny" style="margin-top:8px">订单会储存在这台手机/电脑的浏览器里。</div>
    </aside>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">今日营业额</div><div class="v" id="salesStat">RM0.00</div></div>
    <div class="stat"><div class="k">今日订单</div><div class="v" id="ordersStat">0</div></div>
    <div class="stat"><div class="k">平均客单</div><div class="v" id="avgStat">RM0.00</div></div>
    <div class="stat"><div class="k">今日售出件数</div><div class="v" id="itemsStat">0</div></div>
  </div>

  <section class="card">
    <div class="toolbar">
      <button id="exportBtn">导出订单 CSV</button>
      <button id="exportSummaryBtn">导出产品销量 CSV</button>
      <button id="resetTodayBtn" class="danger">删除今日订单</button>
    </div>
    <h2>今日订单记录</h2>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>时间</th><th>订单</th><th>付款</th><th>Total</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>

  <section class="card section">
    <h2>产品销量</h2>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>产品</th><th>数量</th><th>销售额</th></tr></thead>
        <tbody id="summary"></tbody>
      </table>
    </div>
  </section>

  <section class="card section">
    <h2>产品与价格设定</h2>
    <div class="tiny" style="margin-bottom:8px">直接修改后按 Save。数据只保存在当前浏览器。</div>
    <div id="editor"></div>
    <div class="actions">
      <button class="primary" id="saveProductsBtn">Save Products</button>
      <button class="secondary" id="restoreProductsBtn">Restore Default</button>
    </div>
  </section>
</div>

<script>
const DEFAULT_PRODUCTS = [
  {name:"Kopi", price:6.90},
  {name:"Kopi O", price:5.90},
  {name:"Teh", price:6.90},
  {name:"Milo", price:7.90},
  {name:"Matcha Kopi", price:8.90},
  {name:"Sandwich", price:12.00}
];

let products = JSON.parse(localStorage.getItem("kopilah_products") || "null") || DEFAULT_PRODUCTS;
let cart = {};
let payment = "Cash";

const money = n => "RM" + Number(n).toFixed(2);
const dateKey = () => new Date().toLocaleDateString("en-CA");
const ordersKey = () => "kopilah_orders_" + dateKey();
const getOrders = () => JSON.parse(localStorage.getItem(ordersKey()) || "[]");
const saveOrders = arr => localStorage.setItem(ordersKey(), JSON.stringify(arr));

document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("en-MY", {day:"2-digit",month:"short",year:"numeric"});

function renderProducts(){
  const box = document.getElementById("products");
  box.innerHTML = "";
  products.forEach((p,i)=>{
    const b=document.createElement("button");
    b.className="product";
    b.innerHTML=`<div class="name">${p.name}</div><div class="price">${money(p.price)}</div>`;
    b.onclick=()=>{cart[i]=(cart[i]||0)+1; renderCart();}
    box.appendChild(b);
  });
}

function renderCart(){
  const box=document.getElementById("order");
  const entries=Object.entries(cart).filter(([i,q])=>q>0);
  if(!entries.length){box.innerHTML='<div class="order-empty">还没有加入产品</div>';}
  else{
    box.innerHTML="";
    entries.forEach(([i,q])=>{
      const p=products[Number(i)];
      const row=document.createElement("div");
      row.className="lineitem";
      row.innerHTML=`
        <div><strong>${p.name}</strong><div class="tiny">${money(p.price)} × ${q} = ${money(p.price*q)}</div></div>
        <div class="qty">
          <button onclick="changeQty(${i},-1)">−</button>
          <strong>${q}</strong>
          <button onclick="changeQty(${i},1)">+</button>
        </div>`;
      box.appendChild(row);
    });
  }
  document.getElementById("total").textContent = money(calcTotal());
}

window.changeQty=(i,d)=>{
  cart[i]=(cart[i]||0)+d;
  if(cart[i]<=0) delete cart[i];
  renderCart();
};

function calcTotal(){
  return Object.entries(cart).reduce((s,[i,q])=>s+products[Number(i)].price*q,0);
}

document.querySelectorAll(".paybtn").forEach(btn=>{
  btn.onclick=()=>{
    payment=btn.dataset.pay;
    document.querySelectorAll(".paybtn").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  };
});

document.getElementById("clearBtn").onclick=()=>{cart={};renderCart();};

document.getElementById("completeBtn").onclick=()=>{
  const items=Object.entries(cart).filter(([i,q])=>q>0).map(([i,q])=>({
    name:products[Number(i)].name,
    price:products[Number(i)].price,
    qty:q,
    subtotal:products[Number(i)].price*q
  }));
  if(!items.length){alert("请先加入产品。");return;}
  const order={
    id:Date.now(),
    time:new Date().toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit"}),
    iso:new Date().toISOString(),
    payment,
    items,
    total:calcTotal()
  };
  const orders=getOrders(); orders.push(order); saveOrders(orders);
  cart={}; renderCart(); renderDashboard();
};

function renderDashboard(){
  const orders=getOrders();
  const sales=orders.reduce((s,o)=>s+o.total,0);
  const itemCount=orders.reduce((s,o)=>s+o.items.reduce((a,x)=>a+x.qty,0),0);
  document.getElementById("salesStat").textContent=money(sales);
  document.getElementById("ordersStat").textContent=orders.length;
  document.getElementById("avgStat").textContent=money(orders.length?sales/orders.length:0);
  document.getElementById("itemsStat").textContent=itemCount;

  const hist=document.getElementById("history");
  hist.innerHTML="";
  [...orders].reverse().forEach(o=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${o.time}</td><td>${o.items.map(x=>`${x.name} ×${x.qty}`).join(", ")}</td><td>${o.payment}</td><td>${money(o.total)}</td>`;
    hist.appendChild(tr);
  });
  if(!orders.length) hist.innerHTML='<tr><td colspan="4" class="tiny">今天还没有订单。</td></tr>';

  const map={};
  orders.forEach(o=>o.items.forEach(x=>{
    if(!map[x.name]) map[x.name]={qty:0,sales:0};
    map[x.name].qty+=x.qty; map[x.name].sales+=x.subtotal;
  }));
  const sum=document.getElementById("summary"); sum.innerHTML="";
  Object.entries(map).sort((a,b)=>b[1].sales-a[1].sales).forEach(([name,v])=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${name}</td><td>${v.qty}</td><td>${money(v.sales)}</td>`;
    sum.appendChild(tr);
  });
  if(!Object.keys(map).length) sum.innerHTML='<tr><td colspan="3" class="tiny">暂无销量数据。</td></tr>';
}

function csvEscape(s){return `"${String(s).replaceAll('"','""')}"`;}
function downloadCSV(filename, rows){
  const csv=rows.map(r=>r.map(csvEscape).join(",")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("exportBtn").onclick=()=>{
  const rows=[["Date","Time","Order ID","Items","Payment","Total"]];
  getOrders().forEach(o=>rows.push([
    dateKey(),o.time,o.id,o.items.map(x=>`${x.name} x${x.qty}`).join(" | "),o.payment,o.total.toFixed(2)
  ]));
  downloadCSV(`KOPI-lah_orders_${dateKey()}.csv`,rows);
};

document.getElementById("exportSummaryBtn").onclick=()=>{
  const map={};
  getOrders().forEach(o=>o.items.forEach(x=>{
    if(!map[x.name]) map[x.name]={qty:0,sales:0};
    map[x.name].qty+=x.qty; map[x.name].sales+=x.subtotal;
  }));
  const rows=[["Product","Qty","Sales"]];
  Object.entries(map).forEach(([n,v])=>rows.push([n,v.qty,v.sales.toFixed(2)]));
  downloadCSV(`KOPI-lah_product_summary_${dateKey()}.csv`,rows);
};

document.getElementById("resetTodayBtn").onclick=()=>{
  if(confirm("确定要删除今天所有订单吗？这个动作不能复原。")){
    localStorage.removeItem(ordersKey()); renderDashboard();
  }
};

function renderEditor(){
  const ed=document.getElementById("editor"); ed.innerHTML="";
  products.forEach((p,i)=>{
    const row=document.createElement("div"); row.className="edit-grid";
    row.innerHTML=`<input id="pn${i}" value="${p.name.replaceAll('"','&quot;')}"><input id="pp${i}" type="number" min="0" step="0.10" value="${p.price.toFixed(2)}"><button class="danger" onclick="removeProduct(${i})">×</button>`;
    ed.appendChild(row);
  });
  const add=document.createElement("button"); add.className="secondary"; add.textContent="+ Add Product";
  add.onclick=()=>{products.push({name:"New Item",price:0});renderEditor();};
  ed.appendChild(add);
}
window.removeProduct=(i)=>{products.splice(i,1);renderEditor();};

document.getElementById("saveProductsBtn").onclick=()=>{
  products=products.map((p,i)=>({
    name:document.getElementById(`pn${i}`).value.trim() || "Unnamed",
    price:Number(document.getElementById(`pp${i}`).value)||0
  }));
  localStorage.setItem("kopilah_products",JSON.stringify(products));
  cart={};renderProducts();renderCart();renderEditor();alert("Products saved.");
};

document.getElementById("restoreProductsBtn").onclick=()=>{
  if(confirm("恢复默认产品和价格？")){
    products=JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
    localStorage.setItem("kopilah_products",JSON.stringify(products));
    cart={};renderProducts();renderCart();renderEditor();
  }
};

renderProducts();renderCart();renderDashboard();renderEditor();
</script>
</body>
</html>
